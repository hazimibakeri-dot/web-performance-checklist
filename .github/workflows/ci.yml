name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly link check: external documentation moves over time.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:links
